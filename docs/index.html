<!-- Sidebar Navigation -->

<style>
  /* Sidebar tab navigation */
  .sidebar-tabs {
    display: flex;
    padding: 12px 10px 0;
    gap: 4px;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 2px solid #eaeaea;
    margin-bottom: 12px;
  }

  .sidebar-btn {
    display: block;
    padding: 0px 0px;
    background: #90ddf0;
    color: white !important;
    text-decoration: none;
    border-radius: 6px;
    text-align: center;
    margin: 4px 38px;
  }

  .sidebar-btn:hover {
    opacity: 0.9;
  }

  .sidebar-tab-btn {
    flex: 1;
    padding: 9px 6px;
    border: 2px solid #ddd;
    border-bottom: none;
    background: #f5f7f9;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
    font-size: 11.5px;
    font-weight: 700;
    color: #90ddf0;
    transition: color 0.18s, background 0.18s, border-color 0.18s;
    text-align: center;
    font-family: inherit;
    letter-spacing: 0.2px;
    outline: none;
    line-height: 1.3;
  }

  .sidebar-tab-btn:hover {
    color: #42b983;
    background: #f0faf5;
    border-color: #42b983;
  }

  .sidebar-tab-btn.active {
    background: #ffffff;
    color: #42b983;
    border-color: #42b983;
    border-bottom-color: #fff;
    margin-bottom: -2px;
  }

  .doc-section {
    display: none;
  }

  .doc-section.active {
    display: block;
  }
</style>

<!-- Documentation hero -->

<style>
.doc-hero{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:110px 20px 1px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
    box-sizing:border-box;
}

.doc-hero-badge{
    display:flex;
    align-items:center;
    justify-content:center;

    width:fit-content;

    margin:0 auto 30px;

    gap:6px;
    padding:8px 18px;

    border:1px solid rgba(96,165,250,.4);
    border-radius:30px;

    background:rgba(59,130,246,.1);

    color:#60a5fa;

    font-size:13px;
    font-weight:700;
}


.doc-hero h1{
    max-width:800px;
    margin:0 auto 25px;
}

.doc-hero h1 .grad{
    background:linear-gradient(90deg,#60a5fa,#38bdf8);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.doc-hero p{
    max-width:700px;
    margin:0 auto 40px;
}

.doc-hero-pills{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    max-width:920px;
    margin:0 auto 36px;
}

.doc-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 22px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;
    background:rgba(255,255,255,.04);
    color:#fff !important;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    text-shadow:none !important;
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
}

.doc-pill:hover{
    background:rgba(255,255,255,.09);
    border-color:rgba(96,165,250,.5);
    transform:translateY(-2px);
}

.doc-pill .arrow{
    font-size:13px;
}

.doc-hero-btn{
    display:inline-flex;
    align-items:center;
    padding:14px 32px;
    border-radius:30px;
    background:#2563eb;
    color:#fff !important;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    text-shadow:none !important;
    transition:background .2s ease, transform .2s ease;
}

.doc-hero-btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

@media(max-width:991px){

.doc-hero{
    padding:130px 20px 70px;
}

.doc-hero h1{
    font-size:36px;
}

.doc-hero p{
    font-size:16px;
}

}

@media(max-width:480px){

.doc-hero h1{
    font-size:28px;
}

.doc-pill{
    font-size:13px;
    padding:10px 16px;
}



}

/* Neutralize docsify's default cover sizing so the hero renders at
   natural height instead of being clipped/centered inside a fixed
   100vh flex box. Only override when docsify has applied `.show` —
   otherwise the cover never hides on route change. */
section.cover{
    display:none;
}

section.cover.show{
    height:auto !important;
    min-height:100vh;
    display:block !important;
}

.markdown-section{
    padding-top:20px !important;
}

.app-nav{
    display:none !important;
}

.cover-main{
    width:100% !important;
    max-width:100% !important;

    display:flex !important;
    justify-content:center !important;
    align-items:center !important;

    margin:0 auto !important;
    padding:0 !important;

    text-align:center !important;
}

.cover-h1 {
    width: 100%;
    display: flex;
    justify-content: center;
    margin: -17px;
}

.cover-p{
    width:100%;
    display:flex;
    justify-content:center;
}

html{
    scroll-behavior:smooth;
}

						document.querySelectorAll('.sidebar-tab-btn').forEach(function (btn) {

						});
						document.querySelectorAll('.doc-section').forEach(function (s) {
							s.classList.remove('active');
						});
						var target = document.getElementById('section-' + tab);
						if (target) target.classList.add('active');
						try { localStorage.setItem('docsActiveTab', tab); } catch(e) {}
					}

					function tabForPath(path) {
						return path && path.indexOf('/API-Documentation/') === 0 ? 'api' : 'ui';
					}

					function injectTabs() {
						var nav = document.querySelector('.sidebar-nav');
						if (!nav || nav.querySelector('.sidebar-tabs')) return;

							'<button class="sidebar-tab-btn" data-tab="api">⚙️ API Docs</button>' +
							'</div>';
						var firstSection = nav.querySelector('.doc-section');
						if (firstSection) {
							firstSection.insertAdjacentHTML('beforebegin', tabsHtml);
						} else {
							nav.insertAdjacentHTML('afterbegin', tabsHtml);
						}

						document.querySelectorAll('.sidebar-tab-btn').forEach(function (btn) {
							btn.addEventListener('click', function () {
								activateTab(this.getAttribute('data-tab'));
							});
						});
					}

					hook.ready(injectTabs);
					hook.doneEach(function () {
						injectTabs();
						activateTab(tabForPath(vm.route.path));
					});
