<style>
.doc-hero{

.doc-hero h1{

    font-size:70px;

    line-height:1.1;
    color:#ffffff;
}


.doc-hero h1 .grad{
    /* background:linear-gradient(90deg,#37C3F2); */
	background: #60d6fd;
	color: #ffffff;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

}

    font-size: 12px;
    font-weight: 400;
    line-height: 1.8;
    letter-spacing: 0.01em;
    color: #B8C7E0;
    max-width: 900px;
    margin: 0 auto;
}

.doc-hero-pills{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    max-width:920px;
    margin:0 auto 36px;
}

.doc-pill{
    display:inline-flex;
    align-items:center;

    border-radius:30px;
    background:rgba(255,255,255,.04);
    color:#fff !important;
    text-decoration:none;
    font-size:12px;
    font-weight:lighter;
    text-shadow:none !important;
    transition:background .2s ease, border-color .2s ease, transform .2s ease;

.doc-pill:hover{
    background:rgba(255,255,255,.09);
    border-color:rgba(96,165,250,.5);

}

.doc-pill .arrow{

}

/* Neutralize docsify's default cover sizing so the hero renders at

	<div id="site-header"></div>

	<script>
		// Docsify configuration
		window.$docsify = {
			alias: {
				'/.*/_navbar.md': '/docs/_navbar.md',  // change path if file lives in /docs
			},

			ga: 'G-Z5582BJD5N',
			noCompileLinks: ['/api/.*', '/kafka/.*'],
			auto2top: true,
			coverpage: true,
			executeScript: true,
			loadSidebar: true,
			loadNavbar: true,
			mergeNavbar: true,
			maxLevel: 4,
			subMaxLevel: 2,
			// logo: './_media/Docu-logo.png',
			// name: 'virtualan',
			plugins: [
				function (hook, vm) {
					hook.afterEach(function (html) {
						//   return (
						//     html + '&copy;Virtualan (<a href="https://www.virtualan.io">https://www.virtualan.io</a>) '
						//     +'<span class="right"> <a href="https://twitter.com/VirtualanS" target="_NEW"  class="fa fa-twitter"></a>'
						//     +' <a href="mailto:info@virtualan.io" target="_NEW"  class="fa fa-google"></a>   '
						//     +' <a href="https://www.linkedin.com/company/virtualan-software" target="_NEW"  class="fa fa-linkedin"></a> '
						//     +' <a href="https://www.youtube.com/channel/UCny1F1GiYoo2pARDaSDIzYw" target="_NEW" class="fa fa-youtube"></a> </span> '

						//   )
					})
				},
				function (hook, vm) {
					function activateTab(tab) {
						document.querySelectorAll('.sidebar-tab-btn').forEach(function (btn) {
							btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
						});
						document.querySelectorAll('.doc-section').forEach(function (s) {
							s.classList.remove('active');
						});
						var target = document.getElementById('section-' + tab);
						if (target) target.classList.add('active');
						try { localStorage.setItem('docsActiveTab', tab); } catch(e) {}
					}

					function tabForPath(path) {
						return path && path.indexOf('/API-Documentation/') === 0 ? 'api' : 'ui';
					}

					function injectTabs() {
						var nav = document.querySelector('.sidebar-nav');
						if (!nav || nav.querySelector('.sidebar-tabs')) return;

						var tabsHtml = '<div class="sidebar-tabs">' +
							'<button class="sidebar-tab-btn" data-tab="ui">💻 UI Docs</button>' +
							'<button class="sidebar-tab-btn" data-tab="api">⚙️ API Docs</button>' +
							'</div>';
						var firstSection = nav.querySelector('.doc-section');
						if (firstSection) {
							firstSection.insertAdjacentHTML('beforebegin', tabsHtml);
						} else {
							nav.insertAdjacentHTML('afterbegin', tabsHtml);
						}

						document.querySelectorAll('.sidebar-tab-btn').forEach(function (btn) {
							btn.addEventListener('click', function () {
								activateTab(this.getAttribute('data-tab'));
							});
						});
					}

					hook.ready(injectTabs);
					hook.doneEach(function () {
						injectTabs();
						activateTab(tabForPath(vm.route.path));
					});
				},

				
			],
		};
	</script>
